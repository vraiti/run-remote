# E2E: MiniCPM-o 4.5 on vLLM-Omni /v1/live/sessions (branch feat/live-sessions),
# driven by LiveKit GPTLiveModel in a headless AgentSession
# (vllm-omni/examples/online_serving/live_sessions/livekit/headless.py).
#   run-remote vllm-omni/live-sessions/minicpmo-replay-test
#
# Replay variant: instead of the scripted scenarios, each session plays the
# exact user audio of a scenario
# (vllm-omni-aux/clients/minicpmo-compare/<scenario>_24k.wav) as one stream,
# the same input as minicpmo-duplex-reference, for a side-by-side comparison
# with its outputs (vllm-omni-aux/clients/minicpmo-compare/reference-greedy/).
#
# Same layout as qwen-e2e-test, minus the VAD service: MiniCPM-o uses native
# VAD (the model decides when to listen or speak). Whisper still supplies
# input transcripts. No tools (MiniCPM-o's Live processor has none) and only
# the default voice. The three commands run in parallel; the job ends when
# the first one exits (normally the client, after its scenarios). MiniCPM-o
# waits for Whisper to be healthy: two vLLM engines profiling one GPU at the
# same time misread free memory.
# Scenario artifacts: /tmp/logs/live-e2e/<timestamp>/<scenario>/ on the instance.
#
# Standalone rather than `include: vllm-omni/base`: base pins vllm 0.29 plus
# the local vllm site-package overlay, and feat/live-sessions (from
# origin/main) needs vllm 0.30. The client has its own venv because
# livekit-agents pins openai<3 and the server needs openai>=3.18.
envvars:
- VLLM_OMNI_VERSION_OVERRIDE=0.0.0
instanceFilters:
- regions:
  - us-*
  - eu-*
  - ca-*
  maxHourlyCost: 5
  instanceTypes:
  - g7e.2xlarge
venv:
  python: "3.14"
  packages:
  - vllm==0.30.0
  - setuptools_scm
  - -e vllm-omni --no-build-isolation
  # MiniCPM-o's Token2Wav stage (hyperpyyaml, flashcosyvoice); vllm-omni only
  # lists it in its dev extra.
  - step-audio2==1.0.0
  finiCommands:
  - vllm-omni-aux/utils/ensure-nv-cache-artifact-link.sh
  - vllm-omni-aux/utils/ensure-dlami-link.sh
  - vllm-omni-aux/utils/install-flashinfer-jit-cache.sh
venvs:
  client:
    python: "3.12"
    packages:
    - livekit-agents==1.8.3
    - livekit-plugins-openai==1.8.3
    - piper-tts
sync:
  # rsync only: feat/live-sessions tracks origin (vllm-project/vllm-omni), so
  # git-push would push AUTOCOMMIT/feat/live-sessions upstream.
  vllm-omni:
  - rsync
  vllm-omni-aux:
  - rsync
  - git-push
  nv-cache-artifact:
  - remote-artifact:quay.io/vraiti/run-remote:ec2-nv-compute-cache
# vllm_omni call tracing (vllm_omni/__init__.py): per-(pid, thread, coroutine)
# call logs under /tmp/logs/call-trace/ on the instance.
env:
  RUN_REMOTE_CALL_TRACE: "1"
  # The CUDA driver JIT cache (~/.nv/ComputeCache, persisted in
  # nv-cache-artifact) defaults to 1 GiB; the PTX-only kernels here (e.g.
  # FA2 built for sm_80 only) overflow it, and evicted entries cost a
  # multi-second recompile on the next run. 4 GiB is the maximum.
  CUDA_CACHE_MAXSIZE: "4294967296"
# Leftovers from an earlier run on a reused instance, and its call traces.
# Killing `vllm serve` orphans its engine cores (renamed VLLM::...), so also
# kill whatever still holds the GPU and wait for it to be released; none of
# this job's processes exist yet.
# The nv-cache-artifact sync replaces the linked cache dirs each job, so
# recreate them (the venv finiCommands only run when the venv is built).
initializer: pkill -9 -f "[v]llm serve" ; pkill -9 -f "[l]ive_vad_service" ; nvidia-smi --query-compute-apps=pid --format=csv,noheader | xargs -r kill -9 ; for i in $(seq 30); do [ -z "$(nvidia-smi --query-compute-apps=pid --format=csv,noheader)" ] && break; sleep 1; done ; rm -rf /tmp/logs/call-trace ; vllm-omni-aux/utils/ensure-nv-cache-artifact-link.sh ; sleep 2 ; true
commands:
# Whisper ASR service.
- command:
  - vllm
  - serve
  - openai/whisper-large-v3-turbo
  - --port
  - "15152"
  - --gpu-memory-utilization
  - "0.08"
  - --enforce-eager
# MiniCPM-o 4.5, once Whisper holds its GPU memory.
- command:
  - bash
  - -c
  - |
    until curl -sf http://127.0.0.1:15152/health >/dev/null; do sleep 2; done
    exec vllm serve openbmb/MiniCPM-o-4_5 --omni --trust-remote-code --port 8000 \
      --deploy-config vllm-omni-aux/deploy-configs/minicpm-o/live-1gpu.yaml
# Client: one session per scenario, replaying the saved user audio.
- venv: client
  command:
  - bash
  - -c
  - |
    set -u
    EX=vllm-omni/examples/online_serving/live_sessions/livekit
    IN=vllm-omni-aux/clients/minicpmo-compare
    OUT=/tmp/logs/live-replay/$(date +%Y%m%d-%H%M%S)
    mkdir -p "$OUT"
    for port in 15152 8000; do
      timeout 2700 bash -c "until curl -sf http://127.0.0.1:$port/health >/dev/null; do sleep 5; done" \
        || { echo "server on :$port never became healthy"; exit 1; }
    done
    rc=0
    for scenario in single conversation barge_in native; do
      echo "[{\"wav\": \"$IN/${scenario}_24k.wav\", \"gap_s\": 20}]" > "$OUT/$scenario.json"
      python $EX/headless.py --model openbmb/MiniCPM-o-4_5 --voice default --no-tools \
        --script "$OUT/$scenario.json" --out "$OUT/$scenario" || rc=1
    done
    echo "artifacts: $OUT"
    exit $rc
